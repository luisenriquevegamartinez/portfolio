name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, on purpose.
      #
      # sharp ships platform-specific optional dependencies, and a lockfile generated on
      # Windows does not record the hoisted @emnapi/runtime entry that @img/sharp-wasm32
      # requires on Linux. `npm ci` reads that as an out-of-sync lockfile and refuses to
      # install. `npm install` resolves against the platform it is actually running on.
      #
      # The tradeoff is real: this gives up the strict reproducibility of `npm ci`. The
      # committed lockfile still pins versions, but the runner may resolve optional
      # dependencies on its own.
      - run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npx astro build

      # Must happen after the build and before the artifact upload, or resume.pdf
      # never reaches the deployed site.
      - name: Generate resume PDF
        run: node scripts/generate-resume-pdf.mjs

      # Fails the deploy if the PDF is not a single page of real, extractable text.
      - name: Verify resume PDF
        run: node scripts/verify-resume-pdf.mjs dist/resume.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
